# Wayle 配置 — 颜色跟随当前壁纸(matugen tonal-spot,柔和低饱和)
# 图标缩小:button-icon-size = 0.8

[general]
font-sans = "Maple Mono NF CN"
font-mono = "Maple Mono NF CN"
tearing-mode = false

[bar]
location = "top"
exclusive = true
layer = "top"
scale = 1.0
padding = 0.25
padding-ends = 0.5
module-gap = 0.25
inset-edge = 0.0
inset-ends = 0.0
bg = "bg-surface"
background-opacity = 0
border-location = "none"
rounding = "sm"
shadow = "none"
button-variant = "basic"
button-rounding = "sm"
button-icon-size = 0.8
button-label-weight = "semibold"
dropdown-opacity = 100
button-group-rounding = "full"
button-group-background = "#121212bf"
button-group-opacity = 100
button-group-border-location = "all"
button-group-border-width = 1
button-group-border-color = "#ffffff14"
button-group-padding = 0.2
button-group-module-gap = 0.25

[[bar.layout]]
monitor = "*"
show = true
left = [{ name = "left", modules = ["custom-scratchpad", "hyprland-workspaces", "window-title"] }]
center = [{ name = "center", modules = ["clock"] }]
right = [{ name = "right", modules = ["systray", "bluetooth", "network", "volume", "brightness", "battery", "notifications"] }]

[styling]
scale = 1.0
rounding = "sm"
# 固定 wayle 配色:与状态栏深色药丸统一,避免 matugen 缺失调色板文件
theme-provider = "wayle"

# 测试用自定义模块(魔法棒:呼出 pi 特殊区)
[[modules.custom]]
id = "scratchpad"
button-bg-color = "transparent"
# 魔法棒图标(md-auto_fix)
command = "printf '\U000F0068'"
interval-ms = 0
icon-show = false
label-show = true
label-color = "#89dceb"
left-click = "sh ~/.config/wayle/scripts/scratchpad.sh toggle"
scroll-down = "sh ~/.config/wayle/scripts/scratchpad.sh next"
scroll-up = "sh ~/.config/wayle/scripts/scratchpad.sh prev"

[modules.clock]
icon-show = false
label-color = "#eefff1"
icon-color = "#eefff1"
format = "%H:%M"
button-bg-color = "transparent"
# 24 小时制,日期 + 时间

[modules.hyprland-workspaces]
active-indicator = "background"
active-color = "#ffffff"
container-bg-color = "transparent"
button-bg-color = "transparent"
# 隐藏特殊工作区(-97/-94),特殊区由左侧魔法棒呼出
show-special = false
# 显示所有显示器的工作区,而不只本屏
monitor-specific = false

[modules.battery]
label-color = "#ffeaaa"
icon-color = "#ffeaaa"
label-show = true
button-bg-color = "transparent"

[modules.bluetooth]
label-color = "#a4e4fe"
icon-color = "#a4e4fe"
label-show = false
button-bg-color = "transparent"

[modules.network]
label-color = "#b0f5e5"
icon-color = "#b0f5e5"
label-show = false
button-bg-color = "transparent"

[modules.microphone]
button-bg-color = "transparent"

[modules.volume]
label-color = "#a4e4fe"
icon-color = "#a4e4fe"
label-show = true
button-bg-color = "transparent"

[modules.notifications]
label-color = "#eb4d4b"
icon-color = "#eb4d4b"
popup-monitor = "eDP-1"
label-show = false
button-bg-color = "transparent"

[modules.window-title]
label-color = "#e6f2d6"
icon-color = "#e6f2d6"
button-bg-color = "transparent"

[styling.palette]
bg = "#121212"
surface = "#121212"
elevated = "#1c1c1c"
fg = "#cdd6f4"
fg-muted = "#a6adc8"
primary = "#89dceb"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#89b4fa"

[modules.systray]
label-color = "#e0e0e0"
icon-color = "#e0e0e0"
button-bg-color = "transparent"
border-show = false

[modules.brightness]
label-color = "#fe968b"
icon-color = "#fe968b"
label-show = true
