# qings environment config
# 编辑器
EDITOR=nvim
# 语言
LANG=zh_TW.UTF-8
LC_ALL=zh_TW.UTF-8
# 输入法
XMODIFIERS=@im=fcitx
# GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
# 深色主题
GTK_THEME=Adwaita:dark
QT_QPA_PLATFORMTHEME=gtk3
# 缩放
# 不要在这里设：environment.d 会把值写进 systemd user manager 的环境，重登也会被
# 重新导入，Hyprland 继承它 → 所有程序都拿到（这正是 OpenSCAD/FreeCAD 双重重缩放的根）。
# 合成器已经对显示器做 scale 1.6，Wayland 原生程序自动正确（含微信 4.1）；XWayland
# 程序（Steam、HMC L、CubeMX）在 /etc/nixos/configuration.nix 里用 mkScaled 单独补 1.6。
# GDK_SCALE=2
# QT_SCALE_FACTOR=1.6
XCURSOR_SIZE=24
HYPRCURSOR_SIZE=24
# 代理
# proxy_host=192.168.6.5:20122
proxy_host=127.0.0.1:20122
http_proxy=http://${proxy_host}
https_proxy=http://${proxy_host}
all_proxy=socks5://${proxy_host}
no_proxy=localhost,127.0.0.1,::1
    